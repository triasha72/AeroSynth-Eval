[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosynth-eval"
version = "0.24.0"
description = "Human-aligned evaluation tooling for synthetic aerospace inspection imagery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Triasha Sarkar" }]
dependencies = [
  "pillow>=10.4,<12.0",
  "pydantic>=2.9,<3.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.6,<1.0",
]
mlx = [
  "mlx-vlm==0.5.0",
]
benchmark = [
  "datasets>=4.0,<6.0",
]
train = [
  "mlx-vlm==0.5.0",
]

[project.scripts]
aerosynth-eval = "aerosynth_eval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
