name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project, development, and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,benchmark,real-data]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy src/aerosynth_eval

      - name: Run tests
        run: python -m pytest -q

      - name: Validate bundled manifest
        run: aerosynth-eval validate-manifest data/examples/v0_1_manifest.jsonl

      - name: Validate scenario design
        run: aerosynth-eval validate-scenario-matrix data/design/v0_1_scenario_matrix.csv

      - name: Validate synthetic-asset provenance
        run: aerosynth-eval validate-asset-registry data/registry/v0_1_asset_registry.jsonl

      - name: Validate materialized procedural corpus
        run: aerosynth-eval validate-materialized-corpus

      - name: Validate development annotation queue
        run: aerosynth-eval validate-annotation-queue data/annotations/v0_1_development_annotation_queue.csv

      - name: Validate synthetic-demo rater fixtures
        run: |
          aerosynth-eval validate-rater-annotations tests/fixtures/synthetic_demo/synthetic_demo_rater_a.csv
          aerosynth-eval validate-rater-annotations tests/fixtures/synthetic_demo/synthetic_demo_rater_b.csv

      - name: Summarize synthetic-demo agreement fixture
        run: aerosynth-eval summarize-synthetic-agreement tests/fixtures/synthetic_demo/synthetic_demo_rater_a.csv tests/fixtures/synthetic_demo/synthetic_demo_rater_b.csv

      - name: Preview development-only autograder prompt
        run: aerosynth-eval preview-autograder-prompt asset-fuselage-corrosion-close-diffuse

      - name: Validate synthetic autograder-response fixture
        run: aerosynth-eval validate-autograder-response tests/fixtures/autograder/synthetic_valid_response.json

      - name: Plan local MLX-VLM development smoke run
        run: aerosynth-eval run-mlx-vlm-smoke asset-fuselage-corrosion-close-diffuse --dry-run
